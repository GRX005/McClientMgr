[package]
name = "McClientMgr"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = {version = "0.13.4", features = ["json"]}
serde_json = "1.0.151"
anyhow = "1.0.104"
zip = "8.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"